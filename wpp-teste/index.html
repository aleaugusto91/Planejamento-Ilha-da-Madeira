<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #222;
    }

    p {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #25D366;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .95;
    }

    .hidden {
      display: none;
    }

    .success {
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">

    <div id="welcome-screen">
      <h1>Olá, Alexandre, seja bem-vindo!</h1>
      <p>Precisamos de apenas alguns dados para continuar.</p>
      <button onclick="startForm()">Iniciar</button>
    </div>

    <div id="form-screen" class="hidden">
      <h1>Seus dados</h1>

      <input
        type="number"
        id="age"
        placeholder="Idade"
        required
      >

      <input
        type="date"
        id="birthDate"
        required
      >

      <input
        type="text"
        id="profession"
        placeholder="Profissão"
        required
      >

      <button onclick="submitForm()">
        Enviar
      </button>
    </div>

    <div id="success-screen" class="hidden success">
      <h1>Sucesso!</h1>
      <p>Seus dados foram enviados com sucesso.</p>
      <p>Redirecionando para o WhatsApp...</p>
    </div>

  </div>

  <script>
    function startForm() {
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('form-screen').classList.remove('hidden');
    }

    function submitForm() {
      const age = document.getElementById('age').value;
      const birthDate = document.getElementById('birthDate').value;
      const profession = document.getElementById('profession').value;

      if (!age || !birthDate || !profession) {
        alert('Preencha todos os campos.');
        return;
      }

      document.getElementById('form-screen').classList.add('hidden');
      document.getElementById('success-screen').classList.remove('hidden');

      setTimeout(() => {
        window.location.href =
          'https://wa.me/5516992446784';
      }, 2000);
    }
  </script>

</body>
</html>
